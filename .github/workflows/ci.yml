name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black bandit
      - name: Check formatting
        run: black --check --line-length 120 backend/ scripts/
      - name: Security scan
        run: bandit -r backend/ -ll --exclude backend/test_detector.py -q
      - name: Verify imports
        run: |
          cd backend
          python -c "from detector import detector; print('Detector OK')"
          python -c "from main import app; print('App OK')"
      - name: Unit tests
        run: |
          cd backend
          python test_detector.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build
