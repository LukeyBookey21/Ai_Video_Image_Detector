<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 16px; }
    h1 { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1 span { background: #4f46e5; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .result { padding: 12px; border-radius: 10px; margin-bottom: 8px; }
    .result.ai { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    .result.real { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .result.error { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
    .verdict { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .verdict.ai { color: #f87171; }
    .verdict.real { color: #4ade80; }
    .confidence { font-size: 12px; color: #9ca3af; }
    .explanation { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.5; }
    .empty { text-align: center; color: #6b7280; font-size: 12px; padding: 20px 0; }
    .empty p { margin-bottom: 8px; }
    .url { font-size: 10px; color: #4b5563; word-break: break-all; margin-top: 8px; }
    .footer { font-size: 10px; color: #374151; text-align: center; margin-top: 12px; }
    a { color: #818cf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1><span>AI</span> Detector</h1>
  <div id="content">
    <div class="empty">
      <p>Right-click any image on a webpage and select<br>"Check if AI-generated"</p>
    </div>
  </div>
  <div class="footer">
    <a href="http://localhost:5173" target="_blank">Open full detector</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
